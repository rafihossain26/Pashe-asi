name: Build Pashe Achi Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK with Custom Icon
        run: |
          pip install pillow
          mkdir -p android-app/www
          cp index.html android-app/www/
          cd android-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Pashe Achi" "com.pasheachi.loan" --web-dir www
          npx cap add android

          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([(0, 0), (512, 512)], radius=110, fill='#9E1F1C')
          draw.ellipse([(66, 66), (446, 446)], outline='#F5B041', width=18)
          draw.ellipse([(96, 96), (416, 416)], fill='#B82925')
          draw.rectangle([(185, 165), (218, 345)], fill='#FFFFFF')
          draw.rectangle([(294, 165), (327, 345)], fill='#FFFFFF')
          draw.rectangle([(185, 165), (327, 198)], fill='#FFFFFF')
          draw.rectangle([(185, 245), (327, 278)], fill='#FFFFFF')
          draw.ellipse([(370, 110), (415, 155)], fill='#FFD166')
          img.save('icon.png')
          "

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icon.png android/app/src/main/res/$dir/ic_launcher.png
            cp icon.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp icon.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pashe-Achi-1.0.0-android.apk
      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: android-app/Pashe-Achi-1.0.0-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
