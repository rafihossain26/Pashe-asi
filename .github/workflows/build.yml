name: Build Pashe Achi Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK
        run: |
          mkdir android-app
          mkdir android-app/www
          cp index.html android-app/www/
          cd android-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Pashe Achi" "com.pasheachi.loan" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pashe-Achi-1.0.0-android.apk
      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: android-app/Pashe-Achi-1.0.0-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
