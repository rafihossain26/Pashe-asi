name: Build Pashe Achi Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK with Custom Icon
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-core
          mkdir android-app
          mkdir android-app/www
          cp index.html android-app/www/
          cd android-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Pashe Achi" "com.pasheachi.loan" --web-dir www
          npx cap add android

          cat << 'EOF' > icon.svg
          <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://w3.org">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#B82925"/>
                <stop offset="100%" stop-color="#7A1512"/>
              </linearGradient>
              <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFD166"/>
                <stop offset="100%" stop-color="#E59819"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="14"/>
            <circle cx="256" cy="256" r="165" fill="url(#gold)" opacity="0.15"/>
            <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Noto Sans Bengali, sans-serif" font-weight="bold" font-size="180" fill="#FFFFFF">পা</text>
            <circle cx="385" cy="135" r="24" fill="url(#gold)"/>
          </svg>
          EOF

          rsvg-convert -w 512 -h 512 icon.svg -o icon.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icon.png android/app/src/main/res/$dir/ic_launcher.png
            cp icon.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp icon.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pashe-Achi-1.0.0-android.apk
      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: android-app/Pashe-Achi-1.0.0-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
